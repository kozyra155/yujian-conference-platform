services:
  # The main Indico container which runs flask
  # The same image is also used to run celery
  indico-web: &indico-web
    image: yujian-indico:3.3.13
    restart: unless-stopped
    build:
      context: worker
      args:
        tag: "3.3.13"
    # privileged is ONLY needed if you want to use LaTeX builds
    privileged: false
    command: /opt/indico/run_indico.sh
    depends_on:
      - indico-redis
      - indico-celery
    environment:
      - PYTHONPATH=/opt/indico/extensions
      - PGHOST=${PGHOST}
      - PGUSER=${PGUSER}
      - PGPASSWORD=${PGPASSWORD}
      - PGDATABASE=${PGDATABASE}
    networks:
      - backend
      - frontend
    ports: []
    volumes:
      - 'archive:/opt/indico/archive' # file storage
      - 'customization:/opt/indico/custom'
      - './customization/templates:/opt/indico/custom/templates:ro'
      - './worker/extension:/opt/indico/extensions:ro'
      - './smtp-settings.json:/opt/indico/etc/smtp-settings.json:ro'
      - './smtp_config.py:/opt/indico/etc/smtp_config.py:ro'
      - './payment-config:/opt/indico/etc/payment-config:ro'
      - 'static-files:/opt/indico/static-shared'
      - 'indico-logs:/opt/indico/log' # logs
      - type: bind
        source: ${INDICO_CONFIG}
        target: /opt/indico/etc/indico.conf
        read_only: true
      - type: bind
        source: ${INDICO_LOGGING_CONFIG}
        target: /opt/indico/etc/logging.yaml
        read_only: true
    tmpfs:
      - /opt/indico/tmp:mode=0777
  # Indico celery
  indico-celery: &indico-celery
    <<: *indico-web
    command: /opt/indico/run_celery.sh
    depends_on:
      - indico-redis
    networks:
      - backend
    ports: []
  # Indico celery beat
  indico-celery-beat:
    <<: *indico-celery
    command: /opt/indico/run_celery.sh beat
  # Redis
  indico-redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - backend
    volumes:
      - 'redis:/data'
  # Postgres
  indico-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${PGUSER}
      - POSTGRES_PASSWORD=${PGPASSWORD}
      - POSTGRES_DB=${PGDATABASE}
    networks:
      - backend
    volumes:
      - 'postgres-data:/var/lib/postgresql/data'
  # Nginx proxy
  # Indico can be accessed by default via localhost:8080
  indico-nginx:
    image: ghcr.io/nginxinc/nginx-unprivileged:stable-alpine
    restart: unless-stopped
    depends_on:
      - indico-web
    networks:
      - frontend
    ports:
      - "127.0.0.1:${NGINX_PORT:-12880}:8080"
      - "192.168.2.36:${NGINX_PORT:-12880}:8080"
    volumes:
      - 'static-files:/opt/indico/static:ro'
      - './nginx.conf:/etc/nginx/conf.d/default.conf:ro'
      - './portal:/opt/yujian-portal:ro'

volumes:
  postgres-data:
  archive:
  static-files:
  customization:
  indico-logs:
  redis:
networks:
  backend: {}
  frontend: {}
