<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>遇见科技会议服务平台</title>
  <meta name="description" content="遇见科技会议服务平台，为学术交流提供会议网站、信息发布与会议管理服务。">
  <link rel="icon" type="image/png" href="/portal-assets/meet-logo.png">
  <link rel="stylesheet" href="/portal-assets/styles.css">
  <link rel="stylesheet" href="/portal-assets/brand.css">
  <link rel="stylesheet" href="/portal-assets/portal.css">
  <script src="/portal-assets/translations.js" defer></script>
  <script src="/portal-assets/portal.js" defer></script>
  <link rel="stylesheet" href="/portal-assets/ui-dist/workspace.css">
  <script type="module" src="/portal-assets/ui-dist/workspace.js"></script>
  <script src="/portal-assets/public-conferences.js" defer></script>
  <script src="/portal-assets/navigation.js" defer></script>
</head>
<body class="workspace-body">
  <a class="skip-link" href="#main">跳至主要内容</a>
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="i-site" viewBox="0 0 48 48"><rect x="5" y="8" width="38" height="29" rx="2"/><path d="M5 16h38M11 12h1m5 0h1M18 43h12M24 37v6M14 25l5 4 9-9M30 28h7m-7 5h7"/></symbol>
    <symbol id="i-people" viewBox="0 0 48 48"><circle cx="24" cy="14" r="7"/><path d="M11 41v-6a13 13 0 0 1 26 0v6M8 11a7 7 0 0 0 0 14M40 11a7 7 0 0 1 0 14M4 37v-4a9 9 0 0 1 5-8M44 37v-4a9 9 0 0 0-5-8"/></symbol>
    <symbol id="i-publish" viewBox="0 0 48 48"><circle cx="24" cy="24" r="19"/><path d="M24 13v21m-7-14 7-7 7 7M15 34h18M7 12l-3 5m37 14 3 5"/></symbol>
    <symbol id="i-document" viewBox="0 0 48 48"><path d="M31 28V5H8v36h12M14 13h11m-11 7h11m-11 7h6"/><path d="M44 33c0 5-5 9-11 9h-5l-6 3 2-6a9 9 0 0 1-2-6c0-5 5-9 11-9s11 4 11 9Z"/><path d="M27 33h1m4 0h1m4 0h1"/></symbol>
    <symbol id="i-notice" viewBox="0 0 48 48"><path d="m8 23 27-12v26L8 29V23ZM15 31l3 11h7l-4-9M35 20h5a5 5 0 0 1 0 10h-5M7 22H3v8h5M41 9l3-4m-2 13 5-1m-5 23 3 3"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 48 48"><rect x="6" y="9" width="36" height="33" rx="2"/><path d="M6 19h36M15 5v9M33 5v9m-20 16 7 6 14-12"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 0 1 14 0Z"/><circle cx="12" cy="10" r="2"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 10h16M8 3v4m8-4v4M8 14h3m3 0h2m-8 3h3"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 22v-3a8 8 0 0 1 16 0v3"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/></symbol>
  </defs></svg>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/" aria-label="遇见科技会议服务平台首页">
        <img src="/portal-assets/meet-logo.png" width="68" height="70" alt="遇见科技 Meet Technology">
        <span><strong>遇见科技会议服务平台</strong><small>Meet Technology Conference Service Platform</small></span>
      </a>
      <button class="menu-toggle" type="button" aria-label="打开导航" aria-controls="main-nav" aria-expanded="false"><span></span><span></span><span></span></button>
      <nav id="main-nav" class="main-nav" aria-label="主导航">
        <a href="/">首页</a>
        <a href="/#features">特色功能</a>
        <a href="/events/">会议查询</a>
        <a href="/#news">新闻公告</a>
        <a href="/#contact">联系我们</a>
      </nav>
      <div class="header-actions"><button class="language-toggle" type="button" aria-label="Switch to English">EN</button><a class="login-link" href="/login/" hidden><svg class="icon"><use href="#i-user"/></svg><span>登录</span></a><details class="account-menu" hidden><summary class="account-toggle" aria-label="账户菜单"><svg class="icon"><use href="#i-user"/></svg><span class="account-name" data-no-translate></span><span class="account-chevron" aria-hidden="true">⌄</span></summary><div class="account-dropdown"><p class="account-dropdown-name" data-no-translate></p><a href="/organizer/">我的会议</a><a href="/participation/">我的参会</a><a href="/user/profile/">个人资料</a><a class="account-logout" href="/logout/?next=/">退出登录</a></div></details><a class="header-create" href="/conference/create/">创建会议</a></div>
    </div>
  </header>

  <main id="main" class="workspace-root" data-no-translate>
    <div id="meet-workspace" data-mode="{{ mode }}" data-event-id="{{ event.id if event else '' }}" data-finance-admin="{{ 'true' if session.user and session.user.is_admin else 'false' }}">
      <p class="workspace-loading">正在加载会议工作台… Loading workspace…</p>
    </div>
    <noscript>请启用 JavaScript 使用会议工作台。Please enable JavaScript.</noscript>
  </main>
  <footer class="site-footer"><div class="container"><a class="footer-brand" href="/"><img src="/portal-assets/meet-logo.png" width="60" height="62" alt="遇见科技 Meet Technology">遇见科技会议服务平台</a><p>连接学术交流 · 服务会议全程</p><div class="footer-links"><a href="/#features">特色功能</a><a href="/#conferences">会议查询</a><a href="/#guide">使用指引</a><a href="/login/">主办方登录</a></div><p class="copyright">© <span id="copyright-year">2026</span> 遇见科技　|　本地演示版</p></div></footer>
</body>
</html>
