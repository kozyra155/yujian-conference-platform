server {
  # localhost:8080 is the main entrypoint of this docker-compose setup
  listen 8080;
  listen [::]:8080;

  # Keep local bookmarks on the canonical LAN origin, including login cookies.
  if ($host ~ "^(localhost|127\.0\.0\.1)$") {
    return 307 http://192.168.2.36:12880$request_uri;
  }

  access_log /dev/stdout combined;
  error_log stderr info;

  root       /var/empty;

  sendfile on;
  # The site editor accepts images up to 5 MiB plus the multipart envelope.
  client_max_body_size 6m;

  # The public portal shares the origin with the existing Indico backend.
  location = / {
    root /opt/yujian-portal;
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
  }

  location ^~ /portal-assets/ {
    alias /opt/yujian-portal/;
    add_header Cache-Control "no-cache";
  }

  location = /events/ {
    root /opt/yujian-portal;
    try_files /events.html =404;
    add_header Cache-Control "no-cache";
  }
  location = /events { return 302 /events/; }
  location = /events.html { return 302 /events/; }

  location = /assets/js-vars/user.js {
    proxy_pass http://indico-web:59999;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "private, no-store" always;
  }

  # Serve static files
  location ~ ^/(images|fonts)(.*)/(.+?)(__v[0-9a-f]+)?\.([^.]+)$ {
    alias /opt/indico/static/$1$2/$3.$5;
  }

  location ~ ^/(css|dist|images|fonts)/(.*)$ {
    alias /opt/indico/static/$1/$2;
  }

  location / {
    # Pass request to the container running Indico
    proxy_pass http://indico-web:59999;
    # Set headers for Indico to receive the correct base URL
    proxy_set_header X-Forwarded-Host $http_host;
  }
}
